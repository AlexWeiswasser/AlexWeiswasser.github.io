public abstract class Ability : ScriptableObject

<script type="text/plain" class="code">
public void Init(GameObject creator, GameObject player, Vector3 velocity, float knockback, GameObject spellExplosionEffect, AudioClip[] sounds, float speedIncrease = -1, GameObject counterspell = null)
{
    // Caching
    _playerInDanger = player;
    _spellExplosionEffect = spellExplosionEffect;
    _explosionSounds = sounds;
    thisCreator = creator;
    counterSpellParent = counterspell;

    // Setup
    _initalPosition = transform.position;

    _initalPlayerPos = player.transform.position;

    velocityDirection = velocity;
    knockbackValue = knockback;
    newSpeed = speedIncrease;

    ChangeIntoShrodinger();

    // During runtime
    StartCoroutine(Actions());
    StartCoroutine(Lifetime());
}

private void ChangeIntoShrodinger()
{
    ToggleSprite(false);
    Destroy(GetComponent<Rigidbody2D>());
    Destroy(GetComponent<ScreenWrap>());

    if (gameObject.layer == LayerMask.NameToLayer("CounterSpell"))
    {
        if(!transform.CompareTag("Piercing"))
            MoveBack();
        SetVictim();
    }

    gameObject.layer = LayerMask.NameToLayer("Schrodinger");
}

private void MoveBack()
{
    CircleCollider2D spellCol = GetComponent<CircleCollider2D>();
    _specialCounterOffset = -velocityDirection * (spellCol.radius / 1.5f);
}

private void SetVictim()
{
    if(_playerInDanger.TryGetComponent<MageScript>(out MageScript mScript))
    {
        mScript.lastHitBy = counterSpellParent;
    }
}
</script>

<script type="text/plain" class="code">
private IEnumerator Actions()
{
    Vector3 changeInPos;

    while (!_timesUp)
    {
        if (_playerInDanger != null)
        {
            changeInPos = _playerInDanger.transform.position - _initalPlayerPos;
            transform.position = _initalPosition + changeInPos + _specialCounterOffset;
        }
        yield return null;
    }

    if (_playerInDanger.TryGetComponent<MageScript>(out MageScript mScript))
        mScript.StartCoroutine(mScript.HandleSpellCollision(gameObject.GetComponent<Collider2D>()));

    // ... explosion sound and VFX, then the ghost removes itself
}

private IEnumerator Lifetime()
{
    yield return new WaitForSeconds(GameManager.schrodingerLength);
    _timesUp = true;
}
</script>
